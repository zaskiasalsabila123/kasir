<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasir Cemerlang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container"> 
 <h1>🛒 Kasir Cemerlang</h1>
 
 <!-- menu grid 2 kolom -->
<div class="menu-grid">

  <button class="menu-btn" onclick="tambahKeKeranjang('Ayam Geprek', 35000)">
    <img src="https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400" alt="Ayam Geprek">
    <strong>Ayam Geprek</strong>
    <span>Rp35.000</span>
  </button>

  <button class="menu-btn" onclick="tambahKeKeranjang('Es Teh', 3000)">
    <img src="https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400" alt="Es Teh">
    <strong>Es Teh</strong>
    <span>Rp3.000</span>
  </button>

  <button class="menu-btn" onclick="tambahKeKeranjang('Mie', 8000)">
    <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400" alt="Mie">
    <strong>Mie</strong>
    <span>Rp8.000</span>
  </button>

  <button class="menu-btn" onclick="tambahKeKeranjang('Gorengan', 4000)">
    <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400" alt="Gorengan">
    <strong>Gorengan</strong>
    <span>Rp4.000</span>
  </button>

</div>
 
 <!-- Ringkasan total dan aksi bayar/reset -->
 <div class="summary-box">
   <h3>Total Tagihan:</h3>
   <div id="total-harga" class="total-teks"> Rp.0</div>
   <div class="action-btns">
      <button id="btn-bayar" class="btn-main" disabled onclick="buatTransaksiQR()">Buat QR</button>
      <button id="btn-reset" class="btn-reset" onclick="resetKeranjang()">Reset</button>
   </div>
 </div>
 <!-- Area tampil QR code -->
 <div id="qr-section" class="hidden">
   <h3>ID: <span id="tx-id-display">-</span></h3>
   <canvas id="qr-canvas"></canvas>
   <div id="status-box" class="status-box status-pending">
     status: <strong id="status-teks">Menunggu scan pembayaran </strong>
    </div>
  </div>
 </div>

  <script type="module" src="main.js"></script>
</body>
</html>
